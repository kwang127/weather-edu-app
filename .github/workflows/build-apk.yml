name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Add Capacitor Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Generate Android adaptive icons
        run: |
          # Generate icon PNGs for all Android densities from our source icon
          sudo apt-get install -y imagemagick
          ICON_SRC="public/icon-512x512.png"
          declare -A SIZES=(
            ["mdpi"]=48 ["hdpi"]=72 ["xhdpi"]=96
            ["xxhdpi"]=144 ["xxxhdpi"]=192
          )
          declare -A FG_SIZES=(
            ["mdpi"]=108 ["hdpi"]=162 ["xhdpi"]=216
            ["xxhdpi"]=324 ["xxxhdpi"]=432
          )
          for density in "${!SIZES[@]}"; do
            DIR="android/app/src/main/res/mipmap-${density}"
            mkdir -p "$DIR"
            SIZE=${SIZES[$density]}
            FG=${FG_SIZES[$density]}
            convert "$ICON_SRC" -resize "${SIZE}x${SIZE}" "$DIR/ic_launcher.png"
            convert "$ICON_SRC" -resize "${SIZE}x${SIZE}" "$DIR/ic_launcher_round.png"
            convert "$ICON_SRC" -resize "${FG}x${FG}" "$DIR/ic_launcher_foreground.png"
          done

      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: weather-edu-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
