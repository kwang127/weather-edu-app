name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Debug info
        run: |
          echo "Node: $(node -v)"
          echo "NPM: $(npm -v)"
          echo "ANDROID_HOME: $ANDROID_HOME"
          echo "ANDROID_SDK_ROOT: $ANDROID_SDK_ROOT"
          ls -la android/ || echo "No android dir"
          cat capacitor.config.json
          npx cap --version || echo "cap not found"

      - name: Copy web assets to Android
        run: npx cap copy android --verbose 2>&1 || true

      - name: Update Android plugins
        run: npx cap update android --verbose 2>&1 || true

      - name: Sync Capacitor to Android
        run: npx cap sync android --verbose

      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: weather-edu-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
